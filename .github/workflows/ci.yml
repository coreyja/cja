name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    uses: ./.github/workflows/format-rust.yml

  check-stable:
    uses: ./.github/workflows/check-rust.yml
    with:
      rust-version: stable

  # cja-llm's self dev-dependency turns on `testing`, so every `--all-targets`
  # build compiles the library WITH that feature. This lane checks the
  # library the way a real app consumes it — lib only, `durable` without
  # `testing` — which once failed to compile while every other lane stayed
  # green.
  check-cja-llm-durable-lib:
    name: Check cja-llm lib (durable without testing)
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      SQLX_OFFLINE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Rust toolchain
        run: |
          ver="$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          echo "Resolved toolchain: $ver"
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Cache native cja tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/cja
          key: cja-tools-${{ runner.os }}-${{ runner.arch }}-tsc-7.0.2-tailwindcss-4.3.3

      - name: Check cja-llm lib with durable
        run: cargo check -p cja-llm --lib --features durable

      - name: Check cja-llm lib default
        run: cargo check -p cja-llm --lib

  check-nightly:
    uses: ./.github/workflows/check-rust.yml
    with:
      rust-version: nightly

  sqlx-check:
    uses: ./.github/workflows/sqlx-check.yml

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny

      - name: Run cargo deny
        run: cargo deny check bans

  ring-only:
    name: cja and passport link ring only (no aws-lc-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # reqwest 0.13's `rustls` feature links aws-lc-rs next to ring. With two
      # providers linked and none installed, rustls' `ClientConfig::builder()`
      # panics (eyes-subscriber's websocket transport calls it), and every app
      # build compiles aws-lc-sys. cja-tailnet opts into aws-lc-rs on its own;
      # cja itself must not.
      - name: Assert no aws-lc-rs in production dependency graphs
        run: |
          set -euo pipefail
          for package in cja cja-passport; do
            for features in "" "--all-features" "--no-default-features"; do
              graph=$(cargo tree --locked -p "$package" $features --target all -e normal,build --prefix none --format '{p}')
              if grep -E '^aws-lc-(rs|sys) ' <<<"$graph"; then
                echo "::error::aws-lc-rs is in $package's dependency graph (features: '${features:-default}')"
                cargo tree --locked -p "$package" $features --target all -e features -i aws-lc-rs
                exit 1
              fi
            done
          done
          echo "cja and cja-passport link ring only"

  native-tsc:
    name: Native TypeScript and warm rerun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated build paths
        run: |
          {
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/cja-cold-cache"
            echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/cja-native-build"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cja-native-target"
          } >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Run real TypeScript tests from a cold cache
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$XDG_CACHE_HOME/cja"
          cargo test -p cja-build --lib real_tsc_ -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/tsc-tests.log"
          grep -q 'test tool_cache::tests::real_tsc_valid_fixture ... ok' "$RUNNER_TEMP/tsc-tests.log"
          grep -q 'test tool_cache::tests::real_tsc_type_error ... ok' "$RUNNER_TEMP/tsc-tests.log"
          grep -Eq '^test result: ok\. 2 passed; 0 failed;' "$RUNNER_TEMP/tsc-tests.log"
          test -f "$XDG_CACHE_HOME/cja/tsc-7.0.2-linux-x64/.sha256"
      - name: Verify warm rerun on a new ambient declaration
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cja-build --test rerun warm_add_ambient_declaration -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/rerun-tests.log"
          grep -q 'test warm_add_ambient_declaration ... ok' "$RUNNER_TEMP/rerun-tests.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/rerun-tests.log"

      - name: Run real Tailwind from a cold cache
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$XDG_CACHE_HOME/cja/tailwindcss-4.3.3-linux-x64"
          CJA_REAL_TAILWIND_CACHE_HOME="$XDG_CACHE_HOME" cargo test -p cja-build --lib tests::real_tailwind_cold_cache -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/tailwind-real.log"
          grep -q 'test tests::real_tailwind_cold_cache ... ok' "$RUNNER_TEMP/tailwind-real.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tailwind-real.log"
          test -x "$XDG_CACHE_HOME/cja/tailwindcss-4.3.3-linux-x64"
      - name: Check Tailwind scanner against pinned binary
        shell: bash
        run: |
          set -euo pipefail
          CJA_REAL_TAILWIND_CACHE_HOME="$XDG_CACHE_HOME" cargo test -p cja-build --lib tests::real_tailwind_adversarial_corpus -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/tailwind-corpus.log"
          grep -q 'test tests::real_tailwind_adversarial_corpus ... ok' "$RUNNER_TEMP/tailwind-corpus.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tailwind-corpus.log"
      - name: Verify warm Tailwind Rust source rerun
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cja-build --test rerun warm_tailwind_rust_source -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tailwind-rerun.log"
          grep -q 'test warm_tailwind_rust_source ... ok' "$RUNNER_TEMP/tailwind-rerun.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tailwind-rerun.log"

  scaffold-check:
    name: Scaffold compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Rust toolchain
        run: |
          ver="$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          echo "Resolved toolchain: $ver"
          echo "RUSTUP_TOOLCHAIN=$ver" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Compile freshly generated projects
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cja-cli --test scaffold -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/scaffold.log"
          grep -q 'test generated_projects_compile ... ok' "$RUNNER_TEMP/scaffold.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/scaffold.log"

  deploy:
    # Serialize production deploys. Two merges close together each build their
    # own image and run `flyctl deploy` concurrently; whichever finishes last
    # wins regardless of commit order, so prod can silently serve the older
    # commit while both jobs report green (2026-08-21: eyes #71 overwrote #70).
    # Queue rather than cancel: cancelling mid-`flyctl deploy` abandons a
    # release for no gain, and GitHub drops the older *pending* entry when a
    # newer run queues behind a running one, so the newest SHA still lands last.
    concurrency:
      group: deploy-cja-site
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    needs: [check-stable, sqlx-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
