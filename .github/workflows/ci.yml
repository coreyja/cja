name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  format:
    uses: ./.github/workflows/format-rust.yml

  check-stable:
    uses: ./.github/workflows/check-rust.yml
    with:
      rust-version: stable

  check-nightly:
    uses: ./.github/workflows/check-rust.yml
    with:
      rust-version: nightly

  sqlx-check:
    uses: ./.github/workflows/sqlx-check.yml

  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install cargo-deny
        run: cargo binstall --no-confirm cargo-deny

      - name: Run cargo deny
        run: cargo deny check bans

  native-tsc:
    name: Native TypeScript and warm rerun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated build paths
        run: |
          {
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/cja-cold-cache"
            echo "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/cja-native-build"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cja-native-target"
          } >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: Run real TypeScript tests from a cold cache
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$XDG_CACHE_HOME/cja"
          cargo test -p cja-build --lib real_tsc_ -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/tsc-tests.log"
          grep -q 'test tool_cache::tests::real_tsc_valid_fixture ... ok' "$RUNNER_TEMP/tsc-tests.log"
          grep -q 'test tool_cache::tests::real_tsc_type_error ... ok' "$RUNNER_TEMP/tsc-tests.log"
          grep -Eq '^test result: ok\. 2 passed; 0 failed;' "$RUNNER_TEMP/tsc-tests.log"
          test -f "$XDG_CACHE_HOME/cja/tsc-7.0.2-linux-x64/.sha256"
      - name: Verify warm rerun on a new ambient declaration
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cja-build --test rerun warm_add_ambient_declaration -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/rerun-tests.log"
          grep -q 'test warm_add_ambient_declaration ... ok' "$RUNNER_TEMP/rerun-tests.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/rerun-tests.log"

      - name: Run real Tailwind from a cold cache
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$XDG_CACHE_HOME/cja/tailwindcss-4.3.3-linux-x64"
          CJA_REAL_TAILWIND_CACHE_HOME="$XDG_CACHE_HOME" cargo test -p cja-build --lib tests::real_tailwind_cold_cache -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/tailwind-real.log"
          grep -q 'test tests::real_tailwind_cold_cache ... ok' "$RUNNER_TEMP/tailwind-real.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tailwind-real.log"
          test -x "$XDG_CACHE_HOME/cja/tailwindcss-4.3.3-linux-x64"
      - name: Verify warm Tailwind Rust source rerun
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cja-build --test rerun warm_tailwind_rust_source -- --ignored --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/tailwind-rerun.log"
          grep -q 'test warm_tailwind_rust_source ... ok' "$RUNNER_TEMP/tailwind-rerun.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/tailwind-rerun.log"

  passkey-browser:
    name: Passkey browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      CJA_PASSKEY_STRICT_FRONTEND_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" --component rustfmt --component clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - name: Install frontend dependencies
        working-directory: crates/cja-passkey/frontend
        run: pnpm install --frozen-lockfile
      - name: Check and build frontend
        working-directory: crates/cja-passkey/frontend
        run: |
          pnpm check
          pnpm build
          grep -q 'loginWithUsername' dist/passkey-client.js
          grep -q 'discoverable/start' dist/passkey-client.js
      - name: Install browser test dependencies
        working-directory: crates/cja-passkey/e2e
        run: pnpm install --frozen-lockfile
      - name: Check browser test types and install Chromium
        working-directory: crates/cja-passkey/e2e
        run: |
          pnpm check
          pnpm exec playwright install --with-deps chromium
      - name: Run real WebAuthn browser fixture
        run: cargo test -p cja-passkey --test browser_fixture -- --ignored --nocapture

  deploy:
    # Serialize production deploys. Two merges close together each build their
    # own image and run `flyctl deploy` concurrently; whichever finishes last
    # wins regardless of commit order, so prod can silently serve the older
    # commit while both jobs report green (2026-08-21: eyes #71 overwrote #70).
    # Queue rather than cancel: cancelling mid-`flyctl deploy` abandons a
    # release for no gain, and GitHub drops the older *pending* entry when a
    # newer run queues behind a running one, so the newest SHA still lands last.
    concurrency:
      group: deploy-cja-site
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    needs: [check-stable, sqlx-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
