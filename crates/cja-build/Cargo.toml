[package]
name = "cja-build"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Compile-time embedded asset builder for cja"

[dependencies]
sha2 = "0.11.1"
hex = "0.4.3"
mime_guess = "2.0.5"
thiserror = "2"
anyhow = "1"
rolldown = "=1.2.14"
rolldown_common = "=1.2.14"
tokio = { version = "1", features = ["rt"] }
serde_json = "1"
json5 = "1.3"
flate2 = "1"
tar = "0.4"
tempfile = "3.20"
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env"] }

[lints]
workspace = true
