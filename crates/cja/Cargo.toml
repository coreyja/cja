[package]
name = "cja"
description = "Cron, Jobs and Axum a meta-framework for building web applications"
edition.workspace = true
authors.workspace = true

[features]
default = ["cron", "jobs"]
cron = ["jobs"]
jobs = []
testing = ["serde_urlencoded"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true

futures = "0.3"
thiserror = "2.0.21"
tower-cookies = { version = "0.11.0", features = ["signed", "private"] }
http = "1.0.0"
tower-http = { version = "0.6.6", features = ["trace"] }
tower-service = "0.3.2"
listenfd = "1.0.2"
cron = "0.17.0"
chrono-tz = "0.10.0"

color-eyre = "0.6.3"
eyes-subscriber = "0.8"
tracing-subscriber = { workspace = true }
tracing-tree = { workspace = true }
serde_urlencoded = { version = "0.7", optional = true }
maud.workspace = true
tokio-util.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
# Paused-clock tests for the shutdown supervisor.
tokio = { workspace = true, features = ["test-util"] }
once_cell = "1.19"
tempfile = "3"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
