[package]
name = "cja-llm-app-fixture"
version.workspace = true
edition.workspace = true
publish = false
description = "Compile-and-run proof that an app shaped like the README (cja-llm + rig-agent, no rig-core) can use #[rig_tool]"

[dependencies]
cja-llm = { path = "../cja-llm" }
tokio.workspace = true
rig-agent = { version = "=0.45.0", default-features = false, features = ["derive"] }
serde = { workspace = true }
url = "2"

[dev-dependencies]
cja-llm = { path = "../cja-llm", features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
