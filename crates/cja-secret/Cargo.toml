[package]
name = "cja-secret"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Typed, in-memory secrets from setec for cja apps"
publish = false

[features]
testing = []
# Join the tailnet in-process (Transport::Tailnet) for hosts without tailscaled.
tailnet = ["dep:cja-tailnet"]

[dependencies]
cja = { path = "../cja", default-features = false }
cja-secret-macros = { path = "../cja-secret-macros" }
cja-tailnet = { path = "../cja-tailnet", optional = true }
setec = { path = "../setec" }
thiserror = "2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
cja = { path = "../cja", default-features = false }
cja-secret = { path = ".", features = ["testing"] }
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
wiremock = "0.6"

[lints]
workspace = true
