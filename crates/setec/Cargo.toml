[package]
name = "setec"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "HTTP client for Tailscale's setec secrets server"
publish = false

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
url = "2"
webpki-roots = "1"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror = "2"
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
reqwest.workspace = true
wiremock = "0.6"

[lints]
workspace = true
