[package]
name = "cja-passkey"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
cja = { path = "../cja", default-features = false }
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
] }
webauthn-rs-proto = "0.5.3"
axum = { workspace = true, features = ["macros"] }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true }
url = "2"
tracing.workspace = true
http = "1"
async-trait.workspace = true
tower-cookies = { version = "0.11.0", features = ["private"] }

[build-dependencies]
cja-build = { path = "../cja-build" }

[dev-dependencies]
sqlx.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-cookies = { version = "0.11.0", features = ["private"] }
http-body-util = "0.1"
# Test-only soft authenticator (WebAuthn ceremony driver). Both crates are
# already transitive deps of webauthn-rs-core, so this adds no new build graph.
openssl = "0.10"
serde_cbor_2 = "0.13"
base64.workspace = true
