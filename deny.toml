[bans]
deny = [
  # Each entry the name of a crate and a version range. If version is
  # not specified, all versions will be matched.
  #{ name = "ansi_term", version = "=0.11.0" },
  #
  # Wrapper crates can optionally be specified to allow the crate when it
  # is a direct dependency of the otherwise banned crate
  #{ name = "ansi_term", version = "=0.11.0", wrappers = [] },

  # openssl is allowed only as a transitive dep of webauthn-rs-core
  # (used internally for attestation verification). Direct use is banned.
  { name = "openssl", wrappers = ["webauthn-attestation-ca", "webauthn-rs-core"] },

  # EOL TLS stacks: rustls < 0.23 and rustls-webpki < 0.103.16 never get the
  # distrusted-intermediate SPKI checks (rustls/webpki#546). Keep them out of
  # every app built on cja.
  { name = "rustls", version = "<0.23" },
  { name = "rustls-webpki", version = "<0.103.16" },
]

[sources.allow-org]
# 1 or more github.com organizations to allow git sources for
github = ["coreyja"]
